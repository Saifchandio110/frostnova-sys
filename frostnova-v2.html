<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FROSTNOVA.SYS</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2290%22 font-size=%2290%22>❄</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#030a0f;--pn:rgba(7,26,32,.66);--cy:#6ff5e0;--mn:#3fd9a8;--am:#ff8a3d;--pu:#8f6bff;--tx:#e8fffb;--dim:#7fa9a6;--ln:rgba(111,245,224,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.ov{--cy:#ffc27a;--mn:#ff9a4d;--ln:rgba(255,178,100,.34)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:radial-gradient(ellipse at 50% 40%,#0a2630,var(--bg) 70%);color:var(--tx);font:400 14px/1.5 'Chakra Petch',system-ui,sans-serif;overflow:hidden;color-scheme:dark}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
button,a{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
#app{display:grid;height:100%;gap:10px;padding:10px;grid-template:"h h h" 56px "n s r" 1fr "f f f" 30px/214px 1fr 270px}
.pn{background:var(--pn);border:1px solid var(--ln);backdrop-filter:blur(10px);position:relative;min-height:0}
#stage{clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px))}
#hd{grid-area:h;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
#hd b{font-size:20px;letter-spacing:.16em}#hd small{display:block;color:var(--dim);font-size:11px;letter-spacing:.14em}
.st{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--cy)}
.dot{display:inline-block;width:7px;height:7px;background:var(--mn);box-shadow:0 0 8px var(--mn);margin-right:6px;animation:bl 2s infinite}
@keyframes bl{50%{opacity:.35}}
.guest{border:1px solid var(--cy);padding:4px 10px}
#nav{grid-area:n;padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto}
#nav h2,#rp h2{font-size:11px;color:var(--am);letter-spacing:.14em;font-weight:600;margin:0 4px 8px}
#nav button{display:flex;gap:10px;align-items:center;background:none;border:1px solid transparent;padding:11px 10px;text-align:left;font-size:12px;letter-spacing:.1em;color:var(--dim);transition:.2s;white-space:nowrap}
#nav button i{font-style:normal;color:var(--am);font-family:'Share Tech Mono',monospace}
#nav button:hover{color:var(--tx);border-color:var(--ln);transform:translateX(4px)}
#nav button[aria-current=page]{color:var(--cy);border-color:var(--cy);background:rgba(111,245,224,.1)}
#ovr{margin-top:auto;padding:10px 4px 0;font-size:11px;color:var(--dim)}
#ovr form{display:flex;gap:4px;margin-top:6px}#ovr input{flex:1;min-width:0;background:#000a;border:1px solid var(--ln);color:var(--tx);padding:7px;font:12px 'Share Tech Mono',monospace}
#ovr button{border:1px solid var(--cy);background:none;padding:0 10px}
#stage{grid-area:s;overflow:hidden;background:#02080c}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#sbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px 14px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--ln);background:#02080c99;z-index:3}
#view{position:absolute;inset:34px 0 0 0;z-index:2;overflow:auto;pointer-events:none}
#view>*{pointer-events:auto}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 14px;pointer-events:none!important;text-align:center}
.hero>*{pointer-events:auto}
.hero h1{font-size:clamp(30px,6.2vw,76px);letter-spacing:.1em;line-height:1;text-shadow:0 0 28px rgba(111,245,224,.55);font-weight:700}
.hero h1 span{color:var(--mn)}
.hero p{color:var(--dim);font-size:12px;letter-spacing:.16em;margin-top:8px}
.hero .wm{color:var(--am);font-size:11px;letter-spacing:.2em;margin-bottom:8px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.b{border:1px solid var(--cy);background:rgba(111,245,224,.08);padding:10px 20px;font-size:12px;letter-spacing:.14em;text-decoration:none;display:inline-block;transition:.2s}
.b:hover{background:rgba(111,245,224,.22);box-shadow:0 0 18px rgba(111,245,224,.3)}
.b.a{border-color:var(--am);background:rgba(255,138,61,.1)}.b.a:hover{background:rgba(255,138,61,.24)}
.sec{width:min(560px,100%);margin-left:auto;height:100%;padding:22px;background:rgba(3,12,16,.82);border-left:1px solid var(--ln);overflow:auto;animation:sl .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{opacity:0;transform:translateX(40px)}}
.sec h2{font-size:22px;letter-spacing:.12em;margin-bottom:4px}.sec .sub{color:var(--am);font-size:11px;letter-spacing:.16em;margin-bottom:16px}
.sec p{color:#bfe3df;margin-bottom:12px;max-width:62ch}
.ph{border:1px dashed var(--am);color:var(--am);font-size:11px;padding:6px 10px;margin:0 0 12px;display:inline-block}
.trk{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border:1px solid var(--ln);background:none;margin-bottom:6px;text-align:left}
.trk.on{border-color:var(--cy);background:rgba(111,245,224,.1)}.trk span:first-child{color:var(--am)}
.ctl{display:flex;gap:8px;align-items:center;margin:12px 0}.ctl button{border:1px solid var(--cy);background:none;padding:8px 14px}
#pr{height:4px;background:#ffffff18;flex:1;cursor:pointer}#pr i{display:block;height:100%;width:0;background:var(--cy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--ln);background:#031017;aspect-ratio:1;padding:0;position:relative;overflow:hidden}
.tile svg{width:100%;height:100%}.tile em{position:absolute;left:6px;bottom:4px;font:10px 'Share Tech Mono',monospace;color:var(--am);font-style:normal}
.tile:hover{border-color:var(--cy)}
.vid{aspect-ratio:16/9;border:1px solid var(--ln);display:grid;place-items:center;color:var(--dim);margin-bottom:10px;font-size:12px;background:repeating-linear-gradient(45deg,#06161c,#06161c 10px,#082028 10px 20px)}
.vid iframe{width:100%;height:100%;border:0}
.lnk{display:flex;justify-content:space-between;padding:12px;border:1px solid var(--ln);margin-bottom:8px;text-decoration:none}
.lnk[aria-disabled=true]{opacity:.5;border-style:dashed;cursor:not-allowed}
#rp{grid-area:r;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.ring{width:130px;height:130px;margin:0 auto;border-radius:50%;border:1px dashed var(--mn);display:grid;place-items:center;animation:sp 40s linear infinite;position:relative}
.ring div{animation:sp 40s linear infinite reverse;text-align:center;font-size:30px;line-height:1}.ring small{display:block;font-size:9px;color:var(--dim);letter-spacing:.14em}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{font-size:11px;color:var(--dim);letter-spacing:.1em}.bar div{height:4px;background:#ffffff18;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mn),var(--cy));transition:width 1.6s}
.card{border:1px solid var(--ln);padding:12px;background:#0003}.card h3{font-size:16px;margin:4px 0}
.note{font-size:10px;color:var(--dim);letter-spacing:.08em}
#ft{grid-area:f;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:11px;color:var(--dim);gap:12px;white-space:nowrap;overflow:hidden}
#ft b{color:var(--cy);font-weight:400}
#boot{position:fixed;inset:0;background:var(--bg);z-index:50;display:grid;place-items:center;transition:opacity .7s;color:var(--cy);font-size:13px}
#boot pre{font:inherit;white-space:pre-wrap}#boot.x{opacity:0;pointer-events:none}
#fl{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(111,245,224,.35),transparent);opacity:0;transform:translateY(-100%)}
#fl.go{animation:fl .55s ease-out}@keyframes fl{0%{opacity:1;transform:translateY(-100%)}100%{opacity:0;transform:translateY(100%)}}
#toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-20px);background:#000c;border:1px solid var(--am);color:var(--am);padding:8px 16px;font-size:12px;opacity:0;transition:.3s;z-index:40;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;background:#000e;z-index:45;display:none;place-items:center;padding:20px}#lb.on{display:grid}
#lb>div{width:min(720px,92vw);text-align:center}#lb button{border:1px solid var(--cy);background:none;padding:8px 14px;margin:10px 4px 0}
body.nogl #gl{display:none}body.glitch #app{animation:gl .15s 6}@keyframes gl{50%{transform:translateX(3px);filter:hue-rotate(90deg)}}
#hd,#ft,#nav,#rp{background:none;border:0;backdrop-filter:none}
#hd{border-bottom:1px solid var(--ln)}#ft{border-top:1px solid var(--ln)}
.guest{border:0;background:var(--am);color:#050505;padding:3px 16px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);font-weight:700}
#nav{padding:12px 6px 12px 20px;gap:2px}
#nav::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:1px;background:linear-gradient(var(--cy),transparent)}
#nav button{border:0;position:relative;padding:12px 8px 12px 12px;font-size:13px;letter-spacing:.04em}
#nav button::before{content:"";position:absolute;left:-15px;top:50%;width:7px;height:7px;background:var(--bg);border:1px solid var(--dim);transform:translateY(-50%) rotate(45deg);transition:.2s}
#nav button[aria-current=page]{color:var(--tx);background:linear-gradient(90deg,rgba(111,245,224,.2),transparent)}
#nav button[aria-current=page]::before{background:var(--am);border-color:var(--am);box-shadow:0 0 10px var(--am)}
#ovr input{border:0;border-bottom:1px solid var(--am);background:none}#ovr button{border:0;color:var(--am)}
#rp{padding:12px 0 12px 8px;gap:14px}
.eq{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:1px solid var(--ln)}
.eq i{flex:1;height:100%;background:linear-gradient(var(--cy),var(--mn));transform-origin:bottom;animation:eq 1.6s ease-in-out infinite alternate;opacity:.8}
@keyframes eq{from{transform:scaleY(.1)}to{transform:scaleY(.95)}}
.log{list-style:none;padding:0 0 0 10px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:7px;flex:1;overflow:hidden;border-left:1px solid var(--ln)}.log li:first-child{color:var(--cy)}
.cart{border-left:3px solid var(--am);padding:12px 14px;background:linear-gradient(135deg,rgba(255,138,61,.14),rgba(7,26,32,.7));clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}.cart h3{font-size:20px;margin:4px 0}
@media(max-width:1000px){#app{grid-template:"h h" 56px "n s" 1fr "f f" 30px/190px 1fr}#rp{display:none}}
@media(max-width:700px){#app{grid-template:"h" 52px "s" 1fr "n" auto "f" 30px/1fr;gap:6px;padding:6px}#nav{flex-direction:row;padding:6px}#nav::before,#nav button::before{display:none}#nav h2,#ovr{display:none}#nav button{padding:9px 10px}#nav button:hover{transform:none}.st span:not(:last-child){display:none}.sec{width:100%}#ft span:nth-child(2){display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="boot" role="status"><pre id="bt" class="mono"></pre></div>
<div id="app">
<header id="hd" class="pn"><div><b>FROSTNOVA.SYS</b><small>INDEPENDENT ARTIST NETWORK</small></div>
<div class="st mono"><span><i class="dot"></i>SYSTEM ONLINE</span><span id="clk">--:--:--</span><span class="guest" id="gst">GUEST // 001</span></div></header>
<nav id="nav" class="pn" aria-label="System navigation"><div id="nb" style="display:contents"></div>
<form id="ovr" autocomplete="off"><label for="ok">override key</label><div style="display:flex;gap:4px;margin-top:6px"><input id="ok" placeholder="ACCESS KEY" maxlength="16"><button aria-label="Submit code">↵</button></div></form></nav>
<main id="stage" class="pn"><canvas id="gl" aria-label="3D Frostnova.sys mech, procedural placeholder"></canvas>
<div id="sbar" class="mono"><span id="path">SYS/DECK/HOME</span><span>LINK: ACTIVE</span></div><div id="view" tabindex="-1" aria-live="polite"></div><div id="fl"></div></main>
<aside id="rp" class="pn"><div class="eq" id="eq" aria-hidden="true"></div><p class="note">DECORATIVE SPECTRUM, NOT LIVE DATA</p><ul class="log mono" id="lg" aria-label="Transmission log"></ul>



<div class="cart"><span class="note" style="color:var(--am)">on air</span><h3 id="rt">Photonic Cascade</h3><div class="note">Frostnova.sys</div><a class="b" id="rb" style="margin-top:10px;font-size:11px" target="_blank" rel="noopener">OPEN ON BANDCAMP ↗</a></div></aside>
<footer id="ft" class="pn mono"><span>SECTION: <b id="fs">COMMAND DECK</b></span><span id="fm">STATUS: NOMINAL</span><span>KEYS 0–6 · ESC</span></footer>
</div>
<div id="toast"></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Artwork viewer"><div id="lbc"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== CONTENT (CMS-ready: edit only this object) ===== */
const C={
 album:{title:'Photonic Cascade',url:'https://frostnovasys.bandcamp.com/album/photonic-cascade',
  tracks:Array.from({length:7},(_,i)=>({n:i+1,title:null,src:null})),trackNote:'Track count follows the client reference image: confirm and add titles/audio files.'},
 site:'https://frostnova.tech',
 gallery:Array.from({length:6},(_,i)=>({t:'Artwork slot '+(i+1),credit:null,src:null})),
 secretArt:{t:'Hidden artwork slot',credit:null,src:null},
 videos:[1,2,3].map(i=>({t:'Video slot '+i,embed:null,link:null})),
 nodes:[{l:'Bandcamp',d:'Photonic Cascade',u:'https://frostnovasys.bandcamp.com/album/photonic-cascade'},{l:'frostnova.tech',d:'Current official site',u:'https://frostnova.tech'},
  {l:'Instagram',d:'Handle pending'},{l:'YouTube',d:'Channel pending'},{l:'Streaming platforms',d:'Links pending'},{l:'Contact',d:'Email pending'}],
 codes:{FROSTNOVA:'ov',NOVA:'ov',SARA:'art'}
};
/* ===== UI ===== */
const $=s=>document.querySelector(s),V=$('#view');let cur=-1,ti=-1,lbi=0,unlocked=false;
const au=new Audio();au.preload='none';
const PH=(t)=>'<p class="ph">PLACEHOLDER: '+t+'</p>';
const ph=i=>{const h=(i*53)%360;return '<svg viewBox="0 0 100 100" role="img" aria-label="Placeholder artwork"><rect width="100" height="100" fill="hsl('+h+',55%,8%)"/>'+[0,1,2,3].map(k=>'<circle cx="50" cy="50" r="'+(10+k*11+i*2)+'" fill="none" stroke="hsl('+(h+k*20)+',80%,60%)" stroke-opacity=".5" stroke-dasharray="'+(2+k*3)+' 4"/>').join('')+'<path d="M0 '+(30+i*8)+'L100 '+(80-i*6)+'" stroke="#ff8a3d" stroke-opacity=".6"/></svg>'};
const ext=(l,t,c='b')=>'<a class="'+c+'" href="'+l+'" target="_blank" rel="noopener">'+t+'</a>';
const S=[
{k:'COMMAND DECK',p:'HOME',m:'Core engaged. Welcome, visitor.',cam:[0,1.3,7],look:[0,1,0],r:()=>'<div class="hero"><div><div class="wm mono">// WELCOME TO THE NEURAL GATEWAY</div><h1>FROSTNOVA<span>.SYS</span></h1><p>MUSIC / ART / RESILIENCE / CONNECTION</p></div><div class="btns"><button class="b" data-go="1">▶ EXPLORE MUSIC</button><button class="b a" data-go="3">◈ VISUAL ARCHIVE</button></div></div>'},
{k:'AUDIO ARCHIVE',p:'AUDIO',m:'Audio archive mounted.',cam:[-2.4,1.5,5.6],look:[-.6,1,0],r:()=>'<div class="sec"><h2>AUDIO ARCHIVE</h2><div class="sub mono">'+C.album.title.toUpperCase()+'</div><div id="np" class="mono" style="color:var(--cy)">NO TRACK LOADED</div><div class="ctl"><button data-a="prev" aria-label="Previous">⏮</button><button data-a="play" id="pp" aria-label="Play or pause">▶</button><button data-a="next" aria-label="Next">⏭</button><div id="pr" data-a="seek"><i></i></div></div><p class="note" id="as">Select a track. Audio files are not linked yet; stream the full album on Bandcamp.</p>'+C.album.tracks.map((t,i)=>'<button class="trk mono" data-t="'+i+'"><span>'+String(t.n).padStart(2,'0')+'</span><span>'+(t.title||'Track title pending')+'</span></button>').join('')+PH(C.album.trackNote)+'<div class="btns" style="justify-content:flex-start">'+ext(C.album.url,'LISTEN ON BANDCAMP ↗')+'</div></div>'},
{k:'RELEASE BAY',p:'RELEASES',m:'Release bay open.',cam:[2.4,1,5.6],look:[.6,1,0],r:()=>'<div class="sec"><h2>RELEASE BAY</h2><div class="sub mono">1 RELEASE ON RECORD</div><div class="grid" style="grid-template-columns:150px 1fr"><div class="tile" style="cursor:default">'+ph(2)+'<em>COVER PENDING</em></div><div><h3>'+C.album.title+'</h3><p class="note">Album · Frostnova.sys<br>Tracks: '+C.album.tracks.length+' (confirm)</p>'+ext(C.album.url,'LISTEN ↗')+'</div></div>'+PH('Add singles and release dates in CONTENT.')+'</div>'},
{k:'VISUAL ARCHIVE',p:'VISUAL',m:'Visual archive decrypted.',cam:[0,3.2,5],look:[0,1,0],r:()=>'<div class="sec"><h2>VISUAL ARCHIVE</h2><div class="sub mono">TAP TO ENLARGE</div>'+PH('No client artwork supplied yet.')+'<div class="grid">'+gal().map((g,i)=>'<button class="tile" data-lb="'+i+'" aria-label="'+g.t+'">'+(g.src?'<img src="'+g.src+'" alt="'+g.t+'" loading="lazy" style="width:100%;height:100%;object-fit:cover">':ph(i))+'<em>'+g.t+'</em></button>').join('')+'</div></div>'},
{k:'VIDEO FEED',p:'VIDEO',m:'Video feed standing by.',cam:[-1.6,.5,5.8],look:[0,1,0],r:()=>'<div class="sec"><h2>VIDEO FEED</h2><div class="sub mono">NO FEEDS LINKED</div>'+C.videos.map(v=>'<div class="vid mono">'+(v.embed?'<iframe loading="lazy" src="'+v.embed+'" title="'+v.t+'" allowfullscreen></iframe>':v.t+': embed URL pending')+'</div>').join('')+PH('Add YouTube/Bandcamp embed URLs in CONTENT.videos.')+'</div>'},
{k:'SYSTEM PROFILE',p:'PROFILE',m:'Profile file opened.',cam:[1.6,1.8,4.6],look:[0,1.4,0],r:()=>'<div class="sec"><h2>SYSTEM PROFILE</h2><div class="sub mono">UNIT: FROSTNOVA.SYS</div>'+PH('Biography awaiting client copy.')+'<p>Frostnova.sys is an independent artist project. The central unit on this deck is a procedural stand-in for the project identity.</p><p>Philosophy, project history and credits will appear here once the client supplies approved text.</p></div>'},
{k:'NETWORK NODES',p:'NODES',m:'Network nodes scanned.',cam:[0,1.2,8.6],look:[0,1,0],r:()=>'<div class="sec"><h2>NETWORK NODES</h2><div class="sub mono">EXTERNAL LINKS</div>'+C.nodes.map(n=>n.u?'<a class="lnk" href="'+n.u+'" target="_blank" rel="noopener"><span>'+n.l+'</span><span class="note">'+n.d+' ↗</span></a>':'<a class="lnk" aria-disabled="true" role="link"><span>'+n.l+'</span><span class="note">'+n.d+'</span></a>').join('')+'</div>'}
];
const gal=()=>unlocked?C.gallery.concat([C.secretArt]):C.gallery;
$('#nb').innerHTML=S.map((s,i)=>'<button data-go="'+i+'"><i>'+String(i).padStart(2,'0')+'</i>'+s.k+'</button>').join('');
$('#rb').href=C.album.url;$('#eq').innerHTML=Array.from({length:28},()=>'<i style="animation-delay:-'+(Math.random()*2).toFixed(2)+'s"></i>').join('');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function go(i){if(i===cur)return;if(cur>=0){au.pause()}cur=i;const s=S[i];V.innerHTML=s.r();V.scrollTop=0;
 document.querySelectorAll('#nb button').forEach((b,j)=>j==i?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 $('#path').textContent='SYS/DECK/'+s.p;$('#fs').textContent=s.k;$('#fm').textContent='TRANSMISSION: '+s.m.toUpperCase();const lg=$('#lg');lg.insertAdjacentHTML('afterbegin','<li>'+new Date().toLocaleTimeString([],{hour12:false})+' '+s.m+'</li>');while(lg.children.length>6)lg.lastChild.remove();
 const f=$('#fl');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');if(window.setPose)setPose(s);if(i)V.focus({preventScroll:true});ti=-1}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-t],[data-a],[data-lb]');if(!t)return;const d=t.dataset;
 if(d.go!==undefined)go(+d.go);else if(d.t!==undefined)load(+d.t,true);else if(d.lb!==undefined)lb(+d.lb);
 else if(d.a==='play')tog();else if(d.a==='next')load((ti+1)%C.album.tracks.length,true);else if(d.a==='prev')load((ti+C.album.tracks.length-1)%C.album.tracks.length,true);
